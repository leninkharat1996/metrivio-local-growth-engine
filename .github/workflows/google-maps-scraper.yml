name: Google Maps Scraper

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Business category/keyword to search for"
        required: true
        type: string
      location:
        description: "City/state (or full location string) to search in"
        required: true
        type: string
      depth:
        description: "Scroll depth (more depth = more results per query, slower)"
        required: false
        type: string
        default: "5"

# This workflow runs entirely on GitHub-hosted runners. No local install,
# no Docker Desktop, and no paid APIs are required.
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout metrivio-local-growth-engine
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout gosom/google-maps-scraper (MIT licensed, free/open-source)
        uses: actions/checkout@v4
        with:
          repository: gosom/google-maps-scraper
          path: google-maps-scraper

      - name: Build scraper
        working-directory: google-maps-scraper
        run: go build -o google-maps-scraper .

      - name: Prepare run metadata
        id: meta
        run: |
          slug=$(python3 scripts/google_maps_scraper/slugify_run.py "${{ inputs.keyword }}" "${{ inputs.location }}")
          ts=$(date -u +%Y%m%d_%H%M%S)
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "ts=${ts}" >> "$GITHUB_OUTPUT"

      - name: Build query file
        run: |
          mkdir -p data/google-maps/raw data/google-maps/clean
          python3 scripts/google_maps_scraper/build_query.py \
            --keyword "${{ inputs.keyword }}" \
            --location "${{ inputs.location }}" \
            --out queries.txt
          cat queries.txt

      - name: Run google-maps-scraper (Playwright/Chromium auto-installed on first run)
        run: |
          RAW_CSV="data/google-maps/raw/${{ steps.meta.outputs.slug }}_${{ steps.meta.outputs.ts }}.csv"
          ./google-maps-scraper/google-maps-scraper \
            -input queries.txt \
            -results "$RAW_CSV" \
            -depth "${{ inputs.depth }}" \
            -exit-on-inactivity 3m
          echo "RAW_CSV=$RAW_CSV" >> "$GITHUB_ENV"

      - name: Normalize + deduplicate (deterministic, no AI usage)
        run: |
          CLEAN_PREFIX="data/google-maps/clean/${{ steps.meta.outputs.slug }}_${{ steps.meta.outputs.ts }}"
          python3 scripts/google_maps_scraper/normalize.py \
            --raw-csv "$RAW_CSV" \
            --category "${{ inputs.keyword }}" \
            --location "${{ inputs.location }}" \
            --out-prefix "$CLEAN_PREFIX"
          echo "CLEAN_PREFIX=$CLEAN_PREFIX" >> "$GITHUB_ENV"

      - name: Upload raw results artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-maps-raw-${{ steps.meta.outputs.slug }}-${{ steps.meta.outputs.ts }}
          path: ${{ env.RAW_CSV }}
          retention-days: 30

      - name: Upload clean leads artifact (CSV + JSON)
        uses: actions/upload-artifact@v4
        with:
          name: google-maps-clean-${{ steps.meta.outputs.slug }}-${{ steps.meta.outputs.ts }}
          path: |
            ${{ env.CLEAN_PREFIX }}.csv
            ${{ env.CLEAN_PREFIX }}.json
          retention-days: 90
