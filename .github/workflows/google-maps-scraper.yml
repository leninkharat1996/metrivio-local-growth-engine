name: Google Maps Scraper

on:
  workflow_dispatch:
    inputs:
      search_plan:
        description: >
          One search per line: "keyword | location | depth". depth is
          optional (falls back to default_depth). Blank lines and lines
          starting with # are ignored. Example:
          commercial HVAC contractors | Dallas, TX | 3
          commercial HVAC companies | Dallas, TX | 3
        required: true
        type: string
      default_depth:
        description: "Depth used for a search line that omits its own depth"
        required: false
        type: string
        default: "5"

# This workflow runs entirely on GitHub-hosted runners. No local install,
# no Docker Desktop, and no paid APIs are required.
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout metrivio-local-growth-engine
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout gosom/google-maps-scraper (MIT licensed, free/open-source)
        uses: actions/checkout@v4
        with:
          repository: gosom/google-maps-scraper
          path: google-maps-scraper

      - name: Build scraper
        working-directory: google-maps-scraper
        run: go build -o google-maps-scraper .

      - name: Prepare run metadata
        id: meta
        run: |
          run_id="run_${{ github.run_id }}_${{ github.run_attempt }}"
          run_ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "run_ts=${run_ts}" >> "$GITHUB_OUTPUT"
          echo "run_dir=data/google-maps/${run_id}" >> "$GITHUB_OUTPUT"

      - name: Parse and validate search plan
        id: plan
        run: |
          mkdir -p "${{ steps.meta.outputs.run_dir }}"
          cat > search_plan.txt <<'PLAN_EOF'
          ${{ inputs.search_plan }}
          PLAN_EOF
          python3 scripts/google_maps_scraper/search_plan.py \
            --plan-file search_plan.txt \
            --default-depth "${{ inputs.default_depth }}" \
            --out plan.json
          valid_count=$(python3 -c "import json; print(sum(1 for e in json.load(open('plan.json')) if e['valid']))")
          echo "valid_count=${valid_count}" >> "$GITHUB_OUTPUT"
          echo "Parsed search plan:"
          cat plan.json

      - name: Run each search in the plan (continues past individual failures)
        id: run_searches
        run: |
          set +e
          run_id="${{ steps.meta.outputs.run_id }}"
          run_dir="${{ steps.meta.outputs.run_dir }}"
          : > results.jsonl

          count=$(python3 -c "import json; print(len(json.load(open('plan.json'))))")
          for i in $(seq 0 $((count - 1))); do
            entry=$(python3 -c "import json; print(json.dumps(json.load(open('plan.json'))[$i]))")
            valid=$(echo "$entry" | python3 -c "import json,sys; print(json.load(sys.stdin)['valid'])")
            if [ "$valid" != "True" ]; then
              continue
            fi

            search_id=$(echo "$entry" | python3 -c "import json,sys; print(json.load(sys.stdin)['search_id'])")
            keyword=$(echo "$entry" | python3 -c "import json,sys; print(json.load(sys.stdin)['keyword'])")
            location=$(echo "$entry" | python3 -c "import json,sys; print(json.load(sys.stdin)['location'])")
            depth=$(echo "$entry" | python3 -c "import json,sys; print(json.load(sys.stdin)['depth'])")

            echo "::group::Search ${search_id} (${keyword} | ${location} | depth=${depth})"

            search_dir="${run_dir}/${search_id}"
            mkdir -p "${search_dir}/raw" "${search_dir}/clean"
            raw_csv="${search_dir}/raw/raw.csv"
            clean_prefix="${search_dir}/clean/clean"

            python3 scripts/google_maps_scraper/build_query.py \
              --keyword "${keyword}" --location "${location}" --out queries.txt \
              && ./google-maps-scraper/google-maps-scraper \
                   -input queries.txt \
                   -results "${raw_csv}" \
                   -depth "${depth}" \
                   -exit-on-inactivity 3m

            scrape_status=$?

            if [ "${scrape_status}" -ne 0 ]; then
              echo "::error::Search ${search_id} failed: scraper exited ${scrape_status}"
              python3 -c "import json; print(json.dumps({'search_id': '${search_id}', 'status': 'failed', 'error': 'scraper exited with status ${scrape_status}'}))" >> results.jsonl
              echo "::endgroup::"
              continue
            fi

            stats_json=$(python3 scripts/google_maps_scraper/normalize.py \
              --raw-csv "${raw_csv}" \
              --category "${keyword}" \
              --location "${location}" \
              --out-prefix "${clean_prefix}" \
              --search-id "${search_id}" \
              --run-id "${run_id}")
            normalize_status=$?

            if [ "${normalize_status}" -ne 0 ]; then
              echo "::error::Search ${search_id} failed: normalize exited ${normalize_status}"
              python3 -c "import json; print(json.dumps({'search_id': '${search_id}', 'status': 'failed', 'error': 'normalize exited with status ${normalize_status}'}))" >> results.jsonl
              echo "::endgroup::"
              continue
            fi

            echo "${stats_json}" | python3 -c "import json, sys; stats = json.load(sys.stdin); print(json.dumps({'search_id': '${search_id}', 'status': 'success', 'stats': stats, 'artifacts': {'raw_csv': '${raw_csv}', 'clean_csv': stats['csv_path'], 'clean_json': stats['json_path']}}))" >> results.jsonl

            echo "::endgroup::"
          done
          echo "Collected results:"
          cat results.jsonl

      - name: Build run manifest
        id: manifest
        if: always()
        run: |
          set +e
          python3 scripts/google_maps_scraper/build_manifest.py \
            --run-id "${{ steps.meta.outputs.run_id }}" \
            --plan-file plan.json \
            --results-file results.jsonl \
            --out "${{ steps.meta.outputs.run_dir }}/manifest.json"
          manifest_status=$?
          overall_status=$(python3 -c "import json; print(json.load(open('${{ steps.meta.outputs.run_dir }}/manifest.json'))['overall_status'])")
          echo "overall_status=${overall_status}" >> "$GITHUB_OUTPUT"
          echo "manifest_status=${manifest_status}" >> "$GITHUB_OUTPUT"

      - name: Upload raw CSV artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-maps-raw-${{ steps.meta.outputs.run_id }}
          path: ${{ steps.meta.outputs.run_dir }}/*/raw/*.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Upload clean CSV artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-maps-clean-csv-${{ steps.meta.outputs.run_id }}
          path: ${{ steps.meta.outputs.run_dir }}/*/clean/*.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Upload clean JSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-maps-clean-json-${{ steps.meta.outputs.run_id }}
          path: ${{ steps.meta.outputs.run_dir }}/*/clean/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload run manifest + statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-maps-manifest-${{ steps.meta.outputs.run_id }}
          path: ${{ steps.meta.outputs.run_dir }}/manifest.json
          if-no-files-found: warn
          retention-days: 90

      - name: Restore previous master snapshot from cache (best-effort)
        if: always() && steps.manifest.outcome == 'success'
        uses: actions/cache/restore@v4
        with:
          path: data/master
          key: google-maps-master-store-${{ github.run_id }}
          restore-keys: |
            google-maps-master-store-

      - name: Update master prospect store
        if: always() && steps.manifest.outcome == 'success'
        run: |
          shopt -s nullglob
          clean_json_files=("${{ steps.meta.outputs.run_dir }}"/*/clean/*.json)
          if [ ${#clean_json_files[@]} -eq 0 ]; then
            echo "No clean datasets produced this run; skipping master update."
          else
            python3 scripts/google_maps_scraper/update_master.py \
              --master-dir data/master \
              "${clean_json_files[@]/#/--clean-json=}"
          fi

      - name: Save master snapshot to cache (best-effort, for the next run)
        if: always() && steps.manifest.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/master
          key: google-maps-master-store-${{ github.run_id }}

      - name: Upload master snapshot + discovery history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-maps-master-store-${{ steps.meta.outputs.run_id }}
          path: |
            data/master/master.csv
            data/master/master.json
            data/master/discovery_history.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Fail the workflow if the run wasn't fully successful
        if: always()
        run: |
          status="${{ steps.manifest.outputs.overall_status }}"
          echo "Overall run status: ${status}"
          if [ "${status}" != "success" ]; then
            echo "::error::Collection run status is '${status}' - see manifest artifact for per-search detail."
            exit 1
          fi
